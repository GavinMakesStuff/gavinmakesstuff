<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Blog | Scout</title>
  <meta name="description" content="Job search tips, product updates, and notes from building Scout."/>
  <link rel="icon" type="image/png" href="media/scoutfavicon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
  <style>
    :root {
      --bg: #F4F6F8; --surface: #FFFFFF; --surface-2: #F0F4F7;
      --border: #D0D7DD; --border-dim: #E2E8EC;
      --teal: #005A7A; --teal-mid: #006E96; --teal-light: #EBF5F9;
      --sand: #E8A33D; --sand-text: #4A2E00;
      --text: #1A2B38; --text-body: #2C3E4A; --text-muted: #3A5A6E; --text-dim: #4A6880;
      --font-ui: 'Nunito', sans-serif; --font-mono: 'DM Mono', monospace;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text-body); font-family: var(--font-ui); margin: 0; line-height: 1.65; }
    a { color: inherit; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 0 24px; }

    .hero-band { background: var(--teal); }
    .wave-divider { line-height: 0; }
    .wave-divider svg { display: block; width: 100%; height: 56px; }
    .wave-divider path { fill: var(--teal); }

    nav { display: flex; align-items: center; justify-content: space-between; padding: 22px 24px; max-width: 980px; margin: 0 auto; }
    .brand { display: flex; align-items: center; text-decoration: none; }
    .brand img { height: 34px; display: block; }
    .nav-links { display: flex; align-items: center; gap: 22px; font-size: 0.88rem; font-weight: 700; }
    .nav-links a { text-decoration: none; color: rgba(255,255,255,0.85); }
    .nav-links a:hover, .nav-links a.active { color: #fff; }
    .nav-cta { background: #fff; color: var(--teal) !important; padding: 9px 18px; border-radius: 8px; }
    .nav-cta:hover { filter: brightness(0.96); }
    .nav-hamburger { display: none; background: none; border: none; color: #fff; font-size: 22px; line-height: 1; cursor: pointer; padding: 4px; align-items: center; }

    .hero { text-align: center; padding: 32px 24px 44px; background: var(--bg); }
    .eyebrow { display: inline-block; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--teal); background: var(--teal-light); padding: 5px 12px; border-radius: 20px; margin-bottom: 20px; }
    h1 { font-size: 2.2rem; font-weight: 900; color: var(--text); line-height: 1.15; margin: 0 0 14px; letter-spacing: -0.01em; }
    .sub { font-size: 1.05rem; color: var(--text-muted); max-width: 560px; margin: 0 auto; }

    .section { padding: 8px 0 56px; }
    .empty-state { text-align: center; color: var(--text-muted); padding: 60px 24px; font-size: 0.95rem; }

    .blog-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .blog-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; text-decoration: none; display: flex; flex-direction: column; transition: transform 0.13s, box-shadow 0.13s; }
    .blog-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,90,122,0.1); }
    .blog-card img { width: 100%; height: 170px; object-fit: cover; background: var(--surface-2); }
    .blog-card-body { padding: 18px 20px 22px; flex: 1; display: flex; flex-direction: column; }
    .post-date { font-size: 0.75rem; font-weight: 700; color: var(--teal); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .blog-card h3 { font-size: 1.1rem; font-weight: 800; color: var(--text); margin: 0 0 8px; }
    .blog-card p { font-size: 0.88rem; color: var(--text-muted); margin: 0; }

    footer { border-top: 1px solid var(--border); padding: 28px 24px; }
    .footer-row { max-width: 980px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; font-size: 0.8rem; color: var(--text-dim); }
    .footer-links { display: flex; gap: 18px; }
    .footer-links a { text-decoration: none; color: var(--text-dim); }
    .footer-links a:hover { color: var(--teal); }

    @media (max-width: 760px) {
      h1 { font-size: 1.7rem; }
      .blog-list { grid-template-columns: 1fr; }
      nav { position: relative; }
      .nav-hamburger { display: flex; }
      .nav-links {
        display: none; position: absolute; top: 100%; left: 0; right: 0;
        flex-direction: column; align-items: stretch; gap: 0;
        background: var(--teal); padding: 6px 24px 18px;
        box-shadow: 0 10px 24px rgba(0,0,0,0.18); z-index: 50;
      }
      .nav-links.open { display: flex; }
      .nav-links a { padding: 13px 0; border-top: 1px solid rgba(255,255,255,0.15); }
      .nav-links a:first-child { border-top: none; }
      .nav-cta { text-align: center; margin-top: 10px; }
    }
  </style>
</head>
<body>

<div class="hero-band">
  <nav>
    <a href="index.html" class="brand" aria-label="Scout">
      <img src="media/Scout Logo.png" alt="Scout" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'Scout',style:'font-size:1.25rem;font-weight:800;color:var(--teal);'}))"/>
    </a>
    <button class="nav-hamburger" onclick="document.querySelector('.nav-links').classList.toggle('open')" aria-label="Menu"><i class="ti ti-menu-2"></i></button>
    <div class="nav-links">
      <a href="blog.html" class="active">Blog</a>
      <a href="contact.html">Contact</a>
      <a href="app.html">Sign in</a>
      <a href="app.html" class="nav-cta">Get Started</a>
    </div>
  </nav>
</div>

<div class="wave-divider">
  <svg viewBox="0 0 1440 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,45 C360,95 1080,0 1440,45 L1440,0 L0,0 Z"></path>
  </svg>
</div>

<section class="hero">
  <div class="eyebrow">Scout Blog</div>
  <h1>Job search notes &amp; product updates</h1>
  <p class="sub">Tips for a smarter job search, and what's new in Scout.</p>
</section>

<section class="section wrap">
  <div id="blog-list" class="blog-list"><div class="empty-state">Loading…</div></div>
</section>

<footer>
  <div class="footer-row">
    <div>© 2026 Scout, built in Vancouver, BC</div>
    <div class="footer-links">
      <a href="contact.html#faq">FAQ</a>
      <a href="contact.html">Contact</a>
      <a href="legal/terms.html">Terms</a>
      <a href="legal/privacy.html">Privacy</a>
    </div>
  </div>
</footer>

<script>
function isPostVisible(p) {
  if (p.status) {
    if (p.status === 'published') return true;
    if (p.status === 'scheduled') return !!p.scheduledAt && new Date(p.scheduledAt).getTime() <= Date.now();
    return false;
  }
  return !p.draft;
}
function esc(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function formatDate(d) {
  if (!d) return '';
  var parts = String(d).split('-');
  if (parts.length !== 3) return d;
  var dt = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  return dt.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
}

(async function () {
  var listEl = document.getElementById('blog-list');
  try {
    var res = await fetch('data/sites/scout-blog.json');
    var data = await res.json();
    var posts = (data.posts || []).filter(isPostVisible).sort(function (a, b) {
      return new Date(b.date) - new Date(a.date);
    });
    if (!posts.length) {
      listEl.innerHTML = '<div class="empty-state">No posts yet — check back soon.</div>';
      return;
    }
    listEl.innerHTML = posts.map(function (post) {
      var thumb = post.thumbnail || 'media/scoutfavicon.png';
      return (
        '<a class="blog-card" href="blog-post.html?id=' + encodeURIComponent(post.id) + '">' +
          '<img src="' + esc(thumb) + '" alt="' + esc(post.title) + '">' +
          '<div class="blog-card-body">' +
            '<div class="post-date">' + esc(formatDate(post.date)) + '</div>' +
            '<h3>' + esc(post.title) + '</h3>' +
            '<p>' + esc(post.summary || '') + '</p>' +
          '</div>' +
        '</a>'
      );
    }).join('');
  } catch (e) {
    listEl.innerHTML = '<div class="empty-state">Could not load posts right now.</div>';
    console.error(e);
  }
})();
</script>

</body>
</html>
