<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Belt-and-suspenders alongside the X-Robots-Tag header vercel.json
     already sends for /scout/admin/(.*) — this page should never be
     indexed or linked from anywhere in the public app. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Scout — Admin Analytics</title>
<link rel="stylesheet" href="../css/styles.css"/>
<style>
  body { background: var(--bg); color: var(--text); font-family: var(--font-ui); min-height: 100vh; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 24px 60px; }

  /* ── Gate screens (loading / login / denied) ───────────── */
  .gate { min-height: 80vh; display: flex; align-items: center; justify-content: center; }
  .gate-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 32px 30px; max-width: 380px; width: 90%; text-align: center; }
  .gate-icon { font-size: 1.6rem; margin-bottom: 10px; }
  .gate-title { font-size: 15px; font-weight: 800; margin-bottom: 8px; }
  .gate-sub { font-size: 12px; color: var(--text-muted); line-height: 1.6; margin-bottom: 18px; }
  .gate input[type=email] { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2); color: var(--text); font-family: var(--font-ui); font-size: 13px; margin-bottom: 10px; }
  .gate-error { font-size: 11px; color: var(--red); margin-top: 8px; min-height: 14px; }
  .spinner { width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--teal); border-radius: 50%; margin: 0 auto 14px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Dashboard chrome ───────────────────────────────────── */
  .admin-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .admin-title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
  .admin-title .badge { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; background: var(--teal-light); color: var(--teal); padding: 3px 9px; border-radius: 20px; }
  .admin-actions { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-muted); }
  .admin-actions button { background: none; border: 1px solid var(--border); color: var(--text-muted); border-radius: var(--radius-sm); padding: 7px 12px; font-size: 12px; font-family: var(--font-ui); cursor: pointer; }
  .admin-actions button:hover { border-color: var(--teal); color: var(--teal); }

  /* ── Stat tiles ─────────────────────────────────────────── */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .stat-tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; }
  .stat-val { font-family: var(--font-mono); font-size: 22px; font-weight: 700; color: var(--teal); line-height: 1.1; }
  .stat-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

  /* ── Section cards ──────────────────────────────────────── */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  @media (max-width: 760px) { .grid-2 { grid-template-columns: 1fr; } }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
  .panel-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 4px; }
  .panel-sub { font-size: 11px; color: var(--text-muted); margin-bottom: 14px; }
  .empty-note { font-size: 12px; color: var(--text-muted); padding: 10px 0; }

  /* ── Ranked bar list ────────────────────────────────────── */
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12px; }
  .bar-label { flex: 0 0 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-body); }
  .bar-track { flex: 1; height: 8px; background: var(--surface-3); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--teal); border-radius: 4px; }
  .bar-count { flex: 0 0 30px; text-align: right; font-family: var(--font-mono); color: var(--text-dim); font-size: 11px; }

  /* ── Score tier bar ─────────────────────────────────────── */
  .tier-bar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; margin-bottom: 10px; }
  .tier-seg { display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #fff; }
  .tier-legend { display: flex; gap: 16px; font-size: 11px; color: var(--text-muted); }
  .tier-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  /* ── Daily volume mini chart ────────────────────────────── */
  .vol-chart { display: flex; align-items: flex-end; gap: 3px; height: 90px; margin-top: 6px; }
  .vol-bar { flex: 1; background: var(--teal); border-radius: 2px 2px 0 0; min-height: 2px; }
  .vol-labels { display: flex; justify-content: space-between; font-size: 9px; color: var(--text-dim); margin-top: 4px; font-family: var(--font-mono); }

  .keyword-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--red-bg); color: var(--red); border-radius: 20px; padding: 5px 11px; font-size: 11px; font-family: var(--font-mono); margin: 0 6px 6px 0; }
  .keyword-chip .n { opacity: 0.7; }
</style>
</head>
<body>

<div id="admin-root">
  <div class="gate">
    <div class="gate-card">
      <div class="spinner"></div>
      <div class="gate-sub">Checking access…</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function applyTheme() {
  try {
    var saved = localStorage.getItem('scout-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  } catch (e) { /* storage blocked (privacy mode, sandboxed frame) — fall back to light */ }
})();

var SCOUT_SUPABASE_URL      = 'https://danpqkwdttjqwduhhrbp.supabase.co';
var SCOUT_SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhbnBxa3dkdHRqcXdkdWhocmJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3Mzk0MTMsImV4cCI6MjA5OTMxNTQxM30.g__YZgpVzlN-Y6hYVREY4yuwlCTiFkYJfrZHH3uzpTQ';
var _supa = window.supabase.createClient(SCOUT_SUPABASE_URL, SCOUT_SUPABASE_ANON_KEY);
var root = document.getElementById('admin-root');

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderLoading(msg) {
  root.innerHTML = '<div class="gate"><div class="gate-card"><div class="spinner"></div><div class="gate-sub">' + escHtml(msg || 'Checking access…') + '</div></div></div>';
}

function renderLogin() {
  root.innerHTML =
    '<div class="gate"><div class="gate-card">' +
      '<div class="gate-icon">🔒</div>' +
      '<div class="gate-title">Admin sign-in required</div>' +
      '<div class="gate-sub">This page is restricted. Sign in with your Scout account to continue.</div>' +
      '<input type="email" id="admin-email" placeholder="you@example.com" autocomplete="email"/>' +
      '<button class="btn btn-primary" id="admin-login-btn" style="width:100%;justify-content:center;">Send magic link</button>' +
      '<div class="gate-error" id="admin-login-err"></div>' +
    '</div></div>';

  document.getElementById('admin-login-btn').addEventListener('click', async function () {
    var emailEl = document.getElementById('admin-email');
    var errEl   = document.getElementById('admin-login-err');
    var email   = (emailEl.value || '').trim();
    if (!email || email.indexOf('@') === -1) { errEl.textContent = 'Enter a valid email address.'; return; }
    this.disabled = true; this.textContent = 'Sending…';
    var self = this;
    var { error } = await _supa.auth.signInWithOtp({
      email: email,
      options: { emailRedirectTo: window.location.origin + window.location.pathname, shouldCreateUser: false },
    });
    if (error) {
      errEl.textContent = error.message;
      self.disabled = false; self.textContent = 'Send magic link';
    } else {
      root.innerHTML = '<div class="gate"><div class="gate-card"><div class="gate-icon">📬</div><div class="gate-title">Check your inbox</div><div class="gate-sub">Magic link sent to <strong>' + escHtml(email) + '</strong>. Click it to continue.</div></div></div>';
    }
  });
}

function renderDenied() {
  root.innerHTML =
    '<div class="gate"><div class="gate-card">' +
      '<div class="gate-icon">🚫</div>' +
      '<div class="gate-title">Access denied</div>' +
      '<div class="gate-sub">Your account doesn\'t have access to this page.</div>' +
      '<button class="btn btn-ghost" id="admin-signout-btn" style="width:100%;justify-content:center;">Sign out</button>' +
    '</div></div>';
  document.getElementById('admin-signout-btn').addEventListener('click', async function () {
    await _supa.auth.signOut();
    renderLogin();
  });
}

function barRows(items, max) {
  if (!items || !items.length) return '<div class="empty-note">No data yet.</div>';
  max = max || Math.max.apply(null, items.map(function (i) { return i.count; }));
  return items.map(function (i) {
    var pct = max ? Math.round((i.count / max) * 100) : 0;
    return '<div class="bar-row"><div class="bar-label" title="' + escHtml(i.label) + '">' + escHtml(i.label) + '</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;"></div></div>' +
      '<div class="bar-count">' + i.count + '</div></div>';
  }).join('');
}

function renderDashboard(d) {
  var tierOrder = ['free', 'paid', 'plus', 'pro', 'vip'];
  var tierLabel = { free: 'Free', paid: 'Paid', plus: 'Starter', pro: 'Pro', vip: 'VIP' };

  var scoreTotal = (d.demand.scoreTiers.high || 0) + (d.demand.scoreTiers.mid || 0) + (d.demand.scoreTiers.low || 0);
  function seg(n, color, label) {
    if (!scoreTotal) return '';
    var pct = Math.round((n / scoreTotal) * 100);
    if (!pct) return '';
    return '<div class="tier-seg" style="width:' + pct + '%;background:' + color + ';" title="' + label + ': ' + n + '">' + (pct >= 8 ? pct + '%' : '') + '</div>';
  }

  var volHtml = '<div class="empty-note">No timestamped analysis data yet.</div>';
  if (d.volume.dailyVolume && d.volume.dailyVolume.length) {
    var maxV = Math.max.apply(null, d.volume.dailyVolume.map(function (r) { return r.count; }));
    var bars = d.volume.dailyVolume.map(function (r) {
      var h = maxV ? Math.max(2, Math.round((r.count / maxV) * 90)) : 2;
      return '<div class="vol-bar" style="height:' + h + 'px;" title="' + r.day + ': ' + r.count + '"></div>';
    }).join('');
    var first = d.volume.dailyVolume[0].day, last = d.volume.dailyVolume[d.volume.dailyVolume.length - 1].day;
    volHtml = '<div class="vol-chart">' + bars + '</div><div class="vol-labels"><span>' + first + '</span><span>' + last + '</span></div>';
  }

  var kwHtml = d.skillsGap.topMissingKeywords.length
    ? d.skillsGap.topMissingKeywords.map(function (k) { return '<span class="keyword-chip">' + escHtml(k.label) + ' <span class="n">×' + k.count + '</span></span>'; }).join('')
    : '<div class="empty-note">No data yet.</div>';

  var repHtml = d.companyReputation.length
    ? d.companyReputation.map(function (c) {
        return '<div class="bar-row"><div class="bar-label" title="' + escHtml(c.company) + '">' + escHtml(c.company) + '</div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + Math.round((c.avgRating / 5) * 100) + '%;background:var(--green);"></div></div>' +
          '<div class="bar-count">' + c.avgRating + '</div></div>';
      }).join('')
    : '<div class="empty-note">Not enough reputation data yet (need 2+ analyses of the same company).</div>';

  var scoreCapHtml = barRows(d.skillsGap.scoreCapReasons);

  var q = d.qualificationMatch || {};
  var qualTotal = (q.overqualified||0) + (q.underqualified||0) + (q.matched||0) + (q.unclear||0);
  var qualHtml = '<div class="empty-note">No data yet.</div>';
  if (qualTotal) {
    function qseg(n, color, label) {
      if (!n) return '';
      var pct = Math.round((n / qualTotal) * 100);
      if (!pct) return '';
      return '<div class="tier-seg" style="width:' + pct + '%;background:' + color + ';" title="' + label + ': ' + n + '">' + (pct >= 8 ? pct + '%' : '') + '</div>';
    }
    qualHtml = '<div class="tier-bar">' + qseg(q.matched, 'var(--green)', 'Matched') + qseg(q.overqualified, 'var(--amber)', 'Overqualified') + qseg(q.underqualified, 'var(--red)', 'Underqualified') + qseg(q.unclear, 'var(--border)', 'Unclear') + '</div>' +
      '<div class="tier-legend"><span><span class="dot" style="background:var(--green);"></span>Matched (' + (q.matched||0) + ')</span>' +
      '<span><span class="dot" style="background:var(--amber);"></span>Overqualified (' + (q.overqualified||0) + ')</span>' +
      '<span><span class="dot" style="background:var(--red);"></span>Underqualified (' + (q.underqualified||0) + ')</span>' +
      '<span><span class="dot" style="background:var(--border);"></span>Unclear (' + (q.unclear||0) + ')</span></div>';
  }

  root.innerHTML =
    '<div class="wrap">' +
      '<div class="admin-header">' +
        '<div class="admin-title">Scout Analytics <span class="badge">Admin</span></div>' +
        '<div class="admin-actions"><span id="admin-updated"></span><button id="admin-refresh">Refresh</button><button id="admin-signout">Sign out</button></div>' +
      '</div>' +

      '<div class="stat-grid">' +
        '<div class="stat-tile"><div class="stat-val">' + d.users.total + '</div><div class="stat-label">Total users</div></div>' +
        '<div class="stat-tile"><div class="stat-val">' + d.volume.totalAnalyses + '</div><div class="stat-label">Analyses run</div></div>' +
        '<div class="stat-tile"><div class="stat-val">' + d.volume.totalPostingsAnalyzed + '</div><div class="stat-label">Postings analyzed</div></div>' +
        '<div class="stat-tile"><div class="stat-val">' + d.volume.avgPostingsPerAnalysis + '</div><div class="stat-label">Avg postings / run</div></div>' +
        '<div class="stat-tile"><div class="stat-val">' + d.engagement.totalSaved + '</div><div class="stat-label">Jobs saved</div></div>' +
        '<div class="stat-tile"><div class="stat-val">' + d.engagement.totalApplied + '</div><div class="stat-label">Jobs applied</div></div>' +
      '</div>' +

      '<div class="grid-2">' +
        '<div class="panel"><div class="panel-title">Analysis volume</div><div class="panel-sub">Last 30 days with data</div>' + volHtml + '</div>' +
        '<div class="panel"><div class="panel-title">Tier mix</div><div class="panel-sub">Registered users by plan</div>' +
          barRows(tierOrder.filter(function (t) { return d.users.byTier[t]; }).map(function (t) { return { label: tierLabel[t], count: d.users.byTier[t] }; })) +
        '</div>' +
      '</div>' +

      '<div class="grid-2">' +
        '<div class="panel"><div class="panel-title">Top companies analyzed</div><div class="panel-sub">Every analysis, not just saved/applied</div>' + barRows(d.demand.topCompanies) + '</div>' +
        '<div class="panel"><div class="panel-title">Top job titles</div><div class="panel-sub">Every analysis, not just saved/applied</div>' + barRows(d.demand.topTitles) + '</div>' +
      '</div>' +

      '<div class="grid-2">' +
        '<div class="panel"><div class="panel-title">Match score distribution</div><div class="panel-sub">' + scoreTotal + ' scored postings</div>' +
          '<div class="tier-bar">' + seg(d.demand.scoreTiers.high, 'var(--green)', 'Strong') + seg(d.demand.scoreTiers.mid, 'var(--amber)', 'Partial') + seg(d.demand.scoreTiers.low, 'var(--red)', 'Low') + '</div>' +
          '<div class="tier-legend"><span><span class="dot" style="background:var(--green);"></span>Strong (' + (d.demand.scoreTiers.high||0) + ')</span><span><span class="dot" style="background:var(--amber);"></span>Partial (' + (d.demand.scoreTiers.mid||0) + ')</span><span><span class="dot" style="background:var(--red);"></span>Low (' + (d.demand.scoreTiers.low||0) + ')</span></div>' +
        '</div>' +
        '<div class="panel"><div class="panel-title">Top industries</div><div class="panel-sub">Every analysis, not just saved/applied</div>' + barRows(d.demand.topIndustries) + '</div>' +
      '</div>' +

      '<div class="grid-2">' +
        '<div class="panel"><div class="panel-title">Posting sources</div><div class="panel-sub">Detected from posting text formatting — heuristic, not exact</div>' + barRows(d.sources) + '</div>' +
        '<div class="panel"><div class="panel-title">Posting freshness</div><div class="panel-sub">How long postings had been live when analyzed</div>' + barRows(d.freshness) + '</div>' +
      '</div>' +

      '<div class="grid-2">' +
        '<div class="panel"><div class="panel-title">Most analyzed listings</div><div class="panel-sub">Same posting, analyzed by 2+ different users — pre-application interest</div>' + barRows(d.demand.mostAnalyzedListings) + '</div>' +
        '<div class="panel"><div class="panel-title">Candidate fit vs. role level</div><div class="panel-sub">' + qualTotal + ' analyses with usable experience + level data</div>' + qualHtml + '</div>' +
      '</div>' +

      '<div class="grid-2">' +
        '<div class="panel"><div class="panel-title">Skills gap — most-cited missing keywords</div>' +
          '<div class="panel-sub">What employers keep asking for that candidates don\'t have</div>' + kwHtml + '</div>' +
        '<div class="panel"><div class="panel-title">Why scores get capped</div><div class="panel-sub">Structured reasons behind below-100 matches</div>' + scoreCapHtml + '</div>' +
      '</div>' +

      '<div class="panel">' +
        '<div class="panel-title">Company reputation (aggregate)</div>' +
        '<div class="panel-sub">Average AI-assessed reputation rating across users who analyzed the same company</div>' +
        repHtml +
      '</div>' +
    '</div>';

  document.getElementById('admin-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  document.getElementById('admin-refresh').addEventListener('click', function () { loadDashboard(); });
  document.getElementById('admin-signout').addEventListener('click', async function () { await _supa.auth.signOut(); renderLogin(); });
}

async function loadDashboard() {
  renderLoading('Loading analytics…');
  var session = (await _supa.auth.getSession()).data.session;
  if (!session) { renderLogin(); return; }

  try {
    var res = await fetch('/api/scout-admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
      body: JSON.stringify({ action: 'analytics' }),
    });
    if (res.status === 403 || res.status === 401) { renderDenied(); return; }
    if (!res.ok) throw new Error('Request failed (' + res.status + ')');
    var data = await res.json();
    renderDashboard(data);
  } catch (err) {
    root.innerHTML = '<div class="gate"><div class="gate-card"><div class="gate-icon">⚠️</div><div class="gate-title">Couldn\'t load analytics</div><div class="gate-sub">' + escHtml(err.message) + '</div><button class="btn btn-ghost" onclick="loadDashboard()" style="width:100%;justify-content:center;">Retry</button></div></div>';
  }
}

(async function init() {
  var { data: { session } } = await _supa.auth.getSession();
  if (session) { loadDashboard(); } else { renderLogin(); }

  _supa.auth.onAuthStateChange(function (event, session) {
    if (event === 'SIGNED_IN' && session) loadDashboard();
    if (event === 'SIGNED_OUT') renderLogin();
  });
})();
</script>
</body>
</html>
